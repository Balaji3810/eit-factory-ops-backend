# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- dev

variables:
  imageName: dashboardapi

stages:

# =========================
# BUILD + PUSH DOCKER IMAGE
# =========================
- stage: Build
  jobs:
  - job: BuildAndPush
    pool:
      vmImage: 'ubuntu-latest'

    steps:
    - task: Docker@2
      displayName: Build and Push Image
      inputs:
        containerRegistry: 'crsantechdev-Dev'
        repository: 'dashboardapi'
        command: 'buildAndPush'
        Dockerfile: '**/DashboardApi/Dockerfile'
        tags: |
          latest

# =========================
# DEPLOY TO APP SERVICE
# =========================
- stage: Deploy
  dependsOn: Build
  jobs:
  - job: DeployApp
    pool:
      vmImage: 'ubuntu-latest'

    steps:
    - task: AzureWebAppContainer@1
      inputs:
        azureSubscription: 'DevOps-AzureSponsored'
        appName: 'EIT-factory-ops-dashboard'
        containers: 'crsantechdev-dnerh8h2gne6g8f0.azurecr.io/dashboardapi:latest'
